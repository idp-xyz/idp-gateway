openapi: 3.1.0
info:
  title: IDP Gatekeeper External Credential Control API (DRAFT)
  version: 1.0.0
  description: 'Internal design contract only.

    Only registered Gateway workload identities over mTLS may call these endpoints.


    Two kinds of path live here. /v1/extauthz/check is the HTTP ExtAuthZ exchange between agentgateway and the
    PDP: its shape is dictated by the gateway, and it is the one exercised by tests/acceptance/blackbox on agentgateway 1.7.0 (with
    a mock Gatekeeper, over mutual TLS). The /v1/egress/... paths are IDP''s neutral control API and are NOT an
    ExtAuthZ wire protocol. Of these, tests/acceptance/blackbox runs /v1/egress/authorizations/decision against the same mock, called
    by a mock local broker (Mode B); nothing has run the other two.


    How a provider credential reaches the gateway (credential redemption): for header injection it is delivered
    only in the allow response of /v1/extauthz/check, to the authenticated gateway workload, for the one request
    being authorised. No endpoint in this API returns credential material in a response body, and no handle
    issued here can be exchanged for one through this API. See docs/adr/ADR-0008.md.

    '
servers:
- url: https://gatekeeper-control.idp.internal
paths:
  /v1/extauthz/check:
    get:
      operationId: checkEgressRequestExtAuthz
      summary: HTTP ExtAuthZ check; on allow, releases the provider credential for this one request
      description: 'Called by the gateway for every request on a route with per-request credentials, after it has
        validated the caller''s token. The gateway forwards the original method; GET is shown, the contract is the
        same for every method. The request has no body.

        The x-idp-* headers are written by the gateway from the validated token and from the matched route. The
        gateway must not copy them from the caller, and the PDP must reject a request in which any of them appears
        more than once. x-provider-account is the one caller-supplied input: a request for an account, checked
        against the tenant''s grants, never a fact.

        Any answer other than 200 means the request is not forwarded. If the PDP cannot be reached or does not
        answer in time, the gateway rejects the request (fail closed).'
      security:
      - WorkloadMTLS: []
      parameters:
      - {name: x-idp-verified-subject, in: header, required: true, schema: {type: string}, description: Service identity from the validated token (sub)}
      - {name: x-idp-verified-tenant, in: header, required: true, schema: {type: string}, description: Tenant bound to the validated token}
      - {name: x-idp-verified-env, in: header, required: true, schema: {$ref: '#/components/schemas/Environment'}, description: Environment the token was issued for}
      - {name: x-idp-route-id, in: header, required: true, schema: {type: string}, description: Matched route (constant of the route)}
      - {name: x-idp-provider-id, in: header, required: true, schema: {type: string}, description: Provider of the matched route (constant of the route)}
      - {name: x-idp-operation-id, in: header, required: true, schema: {type: string}, description: Registered operation of the matched route (constant of the route)}
      - {name: x-idp-environment, in: header, required: true, schema: {$ref: '#/components/schemas/Environment'}, description: Environment of the gateway pool (constant of the route)}
      - {name: x-idp-method, in: header, required: true, schema: {type: string}, description: Method of the caller's request}
      - {name: x-idp-path, in: header, required: true, schema: {type: string}, description: Path of the caller's request without the query string - as received and not normalised}
      - {name: x-provider-account, in: header, required: false, schema: {type: string}, description: Account the caller asks for; when absent the tenant must have exactly one granted account}
      responses:
        '200':
          description: Allowed. The gateway copies Authorization, and only Authorization, onto the upstream request.
          headers:
            Authorization:
              required: true
              description: Provider credential for the granted account. Never logged, never cached by the gateway
                across requests, never returned to the caller.
              schema:
                type: string
            X-Idp-Decision-Id:
              required: true
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: The caller of this endpoint is not an authenticated gateway workload. No decision is made.
        '403':
          description: Denied. The body explains why and carries no credential. When a decision was made (policy
            denial, revoked account) the answer carries its number, in the X-Idp-Decision-Id header and as decision_id
            in the body - the same number the PDP logs - so the gateway can write it on the access-log line of
            the refused call. A request refused before any decision (ambiguous trusted context, ambiguous account
            request) has no number and the header and field are absent; none is made up for it.
          headers:
            X-Idp-Decision-Id:
              required: false
              description: Number of the decision that denied the request. Absent when no decision was made.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtAuthzDenial'
        '503':
          description: 'PDP or Broker cannot decide: treated as a denial. Like 403, it carries the decision number
            (header and decision_id) when a decision was attempted.'
          headers:
            X-Idp-Decision-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtAuthzDenial'
  /v1/egress/authorizations/decision:
    post:
      operationId: evaluateEgressRequest
      summary: Evaluate an authenticated gateway caller's egress permission
      description: Caller identity MUST be derived from authenticated workload and validated request context, not
        self-asserted JSON.
      security:
      - WorkloadMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Decision returned. Treat DENY/INDETERMINATE as rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '401':
          description: Unauthenticated Gateway workload
        '403':
          description: Gateway workload lacks this permission
  /v1/egress/revocations:
    get:
      operationId: listRevokedProviderAccounts
      summary: The provider accounts that are refused on every route, and the revocation epoch
      description: 'Served by gateway-authz for its own table of revoked accounts (docs/adr/ADR-0012.md). This is
        not Gatekeeper''s record of grants. Only the one workload identity configured as the revoker may call it;
        the gateway and the broker may not. Where no revoker is configured the path does not exist.'
      security:
      - WorkloadMTLS: []
      responses:
        '200':
          description: The whole table. It holds no credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationState'
        '401':
          description: The caller is not the revoker workload. Nothing is disclosed.
        '404':
          description: No revoker is configured
    post:
      operationId: changeProviderAccountRevocation
      summary: Revoke one provider account, or lift its revocation
      description: 'A revocation takes effect on the next decision, on every route, and is then written to the file
        that keeps it across restarts. If it cannot be written the answer is 500 with error
        revocation_in_effect_but_not_written: the account is refused now and will not be after a restart, unless
        the request is repeated and written. Lifting a revocation is written first and does not happen if it
        cannot be written. Repeating either request changes nothing and is not an error. Only an account that the
        policy names, or that is in the table already, is accepted: a mistyped name is answered 422.'
      security:
      - WorkloadMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
      responses:
        '200':
          description: The state of the account after the call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationChange'
        '400':
          description: Not a RevocationRequest, or a revocation without a reason. Nothing changed.
        '401':
          description: The caller is not the revoker workload. Nothing changed.
        '404':
          description: No revoker is configured
        '422':
          description: The account is neither named in the policy nor in the table. Nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationChange'
        '500':
          description: The change could not be written. The body says what is in effect now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationChange'
  /v1/egress/operation-bans:
    get:
      operationId: listBannedOperations
      summary: The operations that are refused for every account, and the revocation epoch
      description: 'Served by gateway-authz on the same listener as account revocation, for the same revoker
        workload identity (docs/adr/ADR-0012.md V1.3). Where no revoker is configured the path does not exist.
        Banning an operation is not a route publication and does not change agentgateway configuration.'
      security:
      - WorkloadMTLS: []
      responses:
        '200':
          description: The operations that are banned. The body holds no credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBanState'
        '401':
          description: The caller is not the revoker workload. Nothing is disclosed.
        '404':
          description: No revoker is configured
    post:
      operationId: changeOperationBan
      summary: Ban one operation for every account, or lift that ban
      description: 'A ban takes effect on the next decision for that operation_id, for every account, and is then
        written into the same revocations file as account revocations. One epoch covers both. If the ban cannot
        be written the answer is 500 with error revocation_in_effect_but_not_written: the operation is refused
        now and will not be after a restart, unless the request is repeated and written. Lifting a ban is written
        first and does not happen if it cannot be written. Repeating either request changes nothing and is not
        an error. Only an operation_id that the loaded policy names, or that is banned already, is accepted.'
      security:
      - WorkloadMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationBanRequest'
      responses:
        '200':
          description: The state of the operation after the call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBanChange'
        '400':
          description: Not an OperationBanRequest, or a ban without a reason. Nothing changed.
        '401':
          description: The caller is not the revoker workload. Nothing changed.
        '404':
          description: No revoker is configured
        '422':
          description: The operation is neither named in the policy nor banned. Nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBanChange'
        '500':
          description: The change could not be written. The body says what is in effect now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBanChange'
  /v1/egress/credentials/materialize:
    post:
      operationId: materializeEgressCredential
      summary: Resolve a short-lived provider credential after an approved decision
      description: Gateway-only high-privilege API; response must never reach business apps or ordinary logs. LEGACY
        DESIGN DRAFT; do not assume it can satisfy HMAC/mTLS or all multi-tenant credential flows. DO NOT IMPLEMENT -
        it returns credential material in a response body in exchange for a handle, which is what the redemption
        rule in the API description rules out. Superseded by /v1/extauthz/check.
      security:
      - WorkloadMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - decision_id
              - credential_handle
              - request_id
              properties:
                decision_id:
                  type: string
                credential_handle:
                  type: string
                request_id:
                  type: string
      responses:
        '200':
          description: Transient, narrowly scoped material for trusted Gateway injection only.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - header_name
                - header_value
                - expires_at
                properties:
                  header_name:
                    type: string
                    enum:
                    - Authorization
                    - X-API-Key
                  header_value:
                    type: string
                    writeOnly: true
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthenticated
        '403':
          description: No valid grant or stale decision
        '409':
          description: Decision or credential lease revoked
      deprecated: true
  /v1/egress/credentials/prepare:
    post:
      operationId: prepareAuthorizedCredentialUse
      summary: Prepare narrowly scoped provider credential use for a trusted gateway workload
      description: 'Draft control-plane contract. Must bind mTLS workload identity, valid PDP decision, provider
        account, operation, route/config digest, policy version, revocation epoch and request ID. Not a generic
        token dispenser. Provider-origin secrets must never be echoed to caller business apps.

        The answer is a plan, never a secret, and what the plan refers to is redeemed as follows.
        HEADER_INJECTION: not through this API. The credential is released by /v1/extauthz/check for one request;
        this endpoint only lets the gateway learn, ahead of traffic, that the binding exists and is usable, and
        secure_binding_handle is not issued. This is the only kind with PoC evidence.
        TRUSTED_REQUEST_SIGNER: signer_ref names a signer that signs the final outgoing request itself; the key
        never leaves it. MTLS_IDENTITY_REFERENCE: mtls_identity_ref names a client identity mounted into the
        gateway by the secret facility. Neither of these two has been run; both stay design proposals.'
      security:
      - WorkloadMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUseRequest'
      responses:
        '200':
          description: Typed credential execution plan; secret references must only be redeemable by authorized
            Gateway execution context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialUseResponse'
        '401':
          description: Untrusted workload identity
        '403':
          description: Account/operation not granted
        '409':
          description: Revoked or stale authorization decision
        '503':
          description: 'Broker unavailable: fail closed'
components:
  securitySchemes:
    WorkloadMTLS:
      type: mutualTLS
  schemas:
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - route_id
      - operation_id
      - provider_id
      - requested_account_id
      - environment
      - method
      - path
      - config_digest
      properties:
        request_id:
          type: string
        route_id:
          type: string
        operation_id:
          type: string
        provider_id:
          type: string
        requested_account_id:
          type: string
          description: A request, not a fact; checked against the tenant's grants
        environment:
          $ref: '#/components/schemas/Environment'
        method:
          type: string
          description: Method of the caller's request
        path:
          type: string
          description: Path of the caller's request without the query string, as received and not normalised
        config_digest:
          type: string
          description: Digest of the gateway configuration snapshot the route was matched in (G02 §11.2)
        service_id:
          type: string
          description: Candidate only; server MUST bind to authenticated caller identity
        tenant_id:
          type: string
          description: Candidate only; server MUST derive/verify trusted tenant binding
        token_environment:
          $ref: '#/components/schemas/Environment'
          description: Candidate only; environment the caller's validated token was issued for (x-idp-verified-env
            on the ExtAuthZ path). Without it the PDP cannot refuse a token of one environment used on a pool of
            another. Added after the Mode B run in tests/acceptance/blackbox, where the broker had no field to pass it in.
        delegated_subject:
          type: string
          description: Candidate only, present when the service acts for a user; server MUST verify the delegation
            grant and MUST NOT treat a missing value as "any user" (G04 §11.1)
    DecisionResponse:
      description: The decision artefact has one definition, shared with the mock and the fixtures. policy_version
        and revocation_epoch are stated by the PDP, not supplied by the caller.
      $ref: ./authz-decision.schema.json
    Environment:
      type: string
      enum:
      - DEV
      - TEST
      - PROD
    ExtAuthzDenial:
      type: object
      required:
      - result
      - reason_code
      - policy_version
      - revocation_epoch
      properties:
        decision_id:
          type: string
          description: Number of the decision that produced this answer; the same as the X-Idp-Decision-Id header.
            Absent when the request was refused before any decision was made.
        result:
          type: string
          enum:
          - DENY
          - INDETERMINATE
        reason_code:
          type: string
        policy_version:
          type: string
        revocation_epoch:
          type: integer
          minimum: 0
    RevocationRequest:
      type: object
      additionalProperties: false
      required:
      - account_id
      - revoked
      properties:
        account_id:
          type: string
          minLength: 1
          maxLength: 256
          description: At most 256 bytes of UTF-8, no control characters
        revoked:
          type: boolean
          description: true revokes the account; false lifts its revocation
        reason:
          type: string
          maxLength: 512
          description: Required and not blank when revoked is true. At most 512 bytes of UTF-8, no control characters.
            It is kept in the table and written to the service log, so it must not contain a secret.
    RevocationChange:
      type: object
      required:
      - account_id
      - revoked
      - changed
      - revocation_epoch
      properties:
        account_id:
          type: string
        revoked:
          type: boolean
          description: Whether the account is revoked after this call
        changed:
          type: boolean
          description: false when the account was in that state already
        revocation_epoch:
          type: integer
          minimum: 0
          description: The epoch after this call. It rises by one with every change and is kept across restarts.
        error:
          type: string
          enum:
          - unknown_account
          - revocation_in_effect_but_not_written
          - revocations_not_changed
          description: Present on 422 and 500 only
    RevocationState:
      type: object
      required:
      - revocation_epoch
      - revoked_accounts
      properties:
        revocation_epoch:
          type: integer
          minimum: 0
        revoked_accounts:
          type: array
          items:
            $ref: '#/components/schemas/RevokedAccount'
    RevokedAccount:
      type: object
      required:
      - account_id
      - revoked_at
      - revoked_by
      - reason
      properties:
        account_id:
          type: string
        revoked_at:
          type: string
          format: date-time
        revoked_by:
          type: string
          description: The workload identity that made the revocation
        reason:
          type: string
    OperationBanRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - banned
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 256
          description: An operation_id that already appears in the loaded gateway-authz policy. At most 256 bytes of UTF-8, no control characters.
        banned:
          type: boolean
          description: true bans the operation for every account; false lifts the ban
        reason:
          type: string
          maxLength: 512
          description: Required and not blank when banned is true. At most 512 bytes of UTF-8, no control characters. It is kept in the revocations file and written to the service log, so it must not contain a secret.
    OperationBanChange:
      type: object
      required:
      - operation_id
      - banned
      - changed
      - revocation_epoch
      properties:
        operation_id:
          type: string
        banned:
          type: boolean
          description: Whether the operation is banned after this call
        changed:
          type: boolean
          description: false when the operation was in that state already
        revocation_epoch:
          type: integer
          minimum: 0
          description: The epoch after this call. Account revocations and operation bans share it.
        error:
          type: string
          enum:
          - unknown_operation
          - revocation_in_effect_but_not_written
          - revocations_not_changed
          description: Present on 422 and 500 only
    OperationBanState:
      type: object
      required:
      - revocation_epoch
      - banned_operations
      properties:
        revocation_epoch:
          type: integer
          minimum: 0
        banned_operations:
          type: array
          items:
            $ref: '#/components/schemas/BannedOperation'
    BannedOperation:
      type: object
      required:
      - operation_id
      - banned_at
      - banned_by
      - reason
      properties:
        operation_id:
          type: string
        banned_at:
          type: string
          format: date-time
        banned_by:
          type: string
          description: The workload identity that banned the operation. The same identity that revokes accounts.
        reason:
          type: string
    CredentialUseRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - decision_id
      - credential_handle
      - route_id
      - config_digest
      - operation_id
      - environment
      properties:
        request_id:
          type: string
        decision_id:
          type: string
        credential_handle:
          type: string
        route_id:
          type: string
        config_digest:
          type: string
        operation_id:
          type: string
        environment:
          type: string
          enum:
          - DEV
          - TEST
          - PROD
        requested_mode:
          type: string
          enum:
          - API_KEY
          - OAUTH2_CLIENT_CREDENTIALS
          - OAUTH2_AUTHORIZATION_CODE
          - HMAC_REQUEST_SIGNING
          - MTLS_CLIENT_CERT
    CredentialUseResponse:
      type: object
      additionalProperties: false
      required:
      - use_id
      - kind
      - expires_at
      - policy_version
      - revocation_epoch
      properties:
        use_id:
          type: string
        kind:
          type: string
          enum:
          - HEADER_INJECTION
          - TRUSTED_REQUEST_SIGNER
          - MTLS_IDENTITY_REFERENCE
        expires_at:
          type: string
          format: date-time
        policy_version:
          type: string
        revocation_epoch:
          type: integer
          minimum: 0
        secure_binding_handle:
          type: string
          deprecated: true
          description: Not issued. It was an opaque handle with no defined way to redeem it; the redemption rule in
            the API description replaces it. Kept only so that older drafts still parse.
        signer_ref:
          type: string
          description: Only valid for explicitly approved request-signature provider modes
        mtls_identity_ref:
          type: string
          description: Scoped reference to a client TLS identity
