# P1 PoC — native agentgateway configuration, written for and run on the one release pinned
# in deploy/agentgateway/agentgateway.lock.json.
#
# Real:  the agentgateway data plane (JWT validation, HTTP ExtAuthZ, header handling, routing,
#        and its side of the mutual TLS session with the PDP).
# Ours:  the PDP on 27613 is this repository's cmd/gateway-authz (acceptance build). The names
#        below still call it Gatekeeper: gatekeeper.idp.test, .run/tls/gatekeeper.*.
# Mock:  the local broker (mock_broker.py) and the provider (mock_provider.py). Certificates
#        come from a CA made for each run.
# Not covered: TLS towards callers or the provider, real Secret Manager, multi-replica, load.
#
# Run through run.py: it creates the .run/ files referenced below and starts the
# gateway with tests/acceptance/blackbox as working directory (relative paths resolve against the cwd).
#
# There is deliberately no config.session.key here. Left to its defaults and started without
# one, the gateway generates a key and WRITES IT INTO THE CONFIG FILE it was started from.
# run.py therefore starts the gateway from a copy in .run/ and passes a per-run key in the
# SESSION_KEY environment variable (case P1-CF-01). config.storage.mode below is the second
# thing in the way: with it the gateway does not write to this file at all.
#
# Ports 27611-27620 are reserved for this PoC:
#   27611 gateway listener   27612 mock provider      27613 gateway-authz (TLS)
#   27614 gateway admin      27615 gateway stats      27616 gateway readiness
#   27617 "forbidden" target that no route may ever reach
#   27618 mock local broker (Mode B)
#   27619 gateway read-back listener (TLS, the publisher's client certificate required)
#   27620 front proxy (nginx, front.nginx.conf) that forwards to 27611
#
# Left to its default a gateway listener opens its port on every interface of the machine.
# bindAddress below keeps 27611 on loopback (case P1-NL-01); admin, stats and readiness are
# pinned to loopback in the config section.
#
# The gateway accepts a request with two Host headers and has no setting against it
# (P1-SS-04). The front proxy refuses such a request. With 27611 on loopback, the front
# proxy beside the gateway (same host here, same pod on Kubernetes) is the only way in.
config:
  adminAddr: 127.0.0.1:27614
  statsAddr: 127.0.0.1:27615
  readinessAddr: 127.0.0.1:27616
  # The admin address also serves an API that changes the running configuration, and in the
  # default storage mode the gateway writes such a change back into the file it was started
  # from. Loopback only narrows who can call it. readOnly makes the gateway refuse the write,
  # so the published file stays the only source of configuration (case P1-CF-02). Like the
  # rest of this section it is read at startup only.
  # readOnly does not make the admin address read-only: a POST to it still shuts the gateway
  # down or changes its log level. It stays on loopback; see the read-back listener below.
  storage:
    mode: readOnly

# Who may open a connection, decided before any HTTP is read. 27611 is on loopback already.
# 27619 is reachable from other machines and is for one caller only: the publisher, by the
# identity in its verified client certificate. Any other workload of the same CA is cut off.
frontendPolicies:
  networkAuthorization:
    rules:
    - allow: 'destination.port == 27611'
    - allow: 'destination.port == 27619 && source.spiffeId == "spiffe://idp.test/gateway-control/publisher"'

gateways:
  # Read-back (G03 §3-4): after publishing, the publisher asks each instance what it runs.
  # Those answers are on the admin address, which must not leave loopback. This listener
  # requires a client certificate of the workload CA (tls.root) and has one route, at the
  # end of this file, that forwards two GETs to the admin address and nothing else.
  read-back:
    port: 27619
    tls:
      cert: .run/tls/gateway-readback.crt
      key: .run/tls/gateway-readback.key
      root: .run/tls/ca.crt
  egress-test:
    port: 27611
    bindAddress: 127.0.0.1
    protocol: HTTP
    # Caller authentication (G04 §0 item 1). Strict: a request without a valid token is rejected.
    # After validation the gateway removes the token from the request, so the caller's IDP JWT
    # is not what travels on to the PDP or the provider.
    jwtAuth:
      mode: strict
      issuer: https://gatekeeper.idp.test
      audiences: [idp-egress-gateway]
      jwks:
        file: .run/jwks.json

routes:
# ---------------------------------------------------------------------------------------
# Mode A (G04 §4): per-request credential chosen by the PDP and injected by the gateway.
# ---------------------------------------------------------------------------------------
- name: mockcarrier-tracking-get
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/mockcarrier/v1/tracking
    method: GET
  policies:
    # Canonical-path allowlist (G03 §5 "URI 改写"). Only /segment/segment... built from
    # unreserved characters is routable: no percent sign (so no encoded or double-encoded
    # dot or slash), no empty, "." or ".." segment, no trailing slash, no ";params".
    # gateway-authz applies the same rule (internal/egressauthz/domain, CanonicalPathPattern);
    # internal/architecture has a test that fails when the two differ.
    authorization:
      rules:
      - allow: 'request.path.matches("^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$")'
    extAuthz:
      host: 127.0.0.1:27613
      failureMode: deny
      # The only caller-supplied header the PDP sees. It is a *request* for an account,
      # never an authorization fact; the PDP re-checks it against the tenant's grants.
      includeRequestHeaders:
      - x-provider-account
      policies:
        # Workload mTLS on the gateway -> PDP hop. The gateway presents its own certificate
        # and accepts only a PDP certificate issued by the workload CA for this name. The
        # PDP reads the caller's identity from the certificate, not from a header.
        backendTLS:
          cert: .run/tls/gateway.crt
          key: .run/tls/gateway.key
          root: .run/tls/ca.crt
          hostname: gatekeeper.idp.test
        http:
          requestTimeout: 1s
      protocol:
        http:
          path: '"/v1/extauthz/check"'
          # Trusted context: built by the gateway from the *validated* token and from
          # route constants. Nothing here is copied from caller-controlled headers.
          addRequestHeaders:
            x-idp-verified-subject: jwt.sub
            x-idp-verified-tenant: jwt.tenant_id
            x-idp-verified-env: jwt.env
            x-idp-route-id: '"mockcarrier-tracking-get"'
            x-idp-provider-id: '"mockcarrier"'
            x-idp-operation-id: '"tracking.get"'
            x-idp-environment: '"TEST"'
            x-idp-method: request.method
            x-idp-path: request.path
          # Upstream authentication (G04 §0 item 3): the provider credential the PDP
          # released for this decision is copied onto the upstream request.
          includeResponseHeaders:
          - authorization
    urlRewrite:
      # G03 §5: Host/:authority must be the approved upstream, never what the caller sent.
      authority:
        full: 127.0.0.1:27612
      path:
        prefix: /v1/tracking
    # G03 §5: provider redirects and cookies are not handed to the business client.
    responseHeaderModifier:
      remove:
      - location
      - set-cookie
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27612
    policies:
      # Fail closed if the PDP allowed but released no credential: the caller's token was
      # already removed, so an Authorization header here can only have come from the PDP.
      authorization:
        rules:
        - allow: 'request.headers["authorization"].startsWith("Bearer ")'
      requestHeaderModifier:
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env

- name: mockcarrier-labels-create
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/mockcarrier/v1/labels
    method: POST
  policies:
    authorization:
      rules:
      - allow: 'request.path.matches("^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$")'
    extAuthz:
      host: 127.0.0.1:27613
      failureMode: deny
      includeRequestHeaders:
      - x-provider-account
      policies:
        backendTLS:
          cert: .run/tls/gateway.crt
          key: .run/tls/gateway.key
          root: .run/tls/ca.crt
          hostname: gatekeeper.idp.test
        http:
          requestTimeout: 1s
      protocol:
        http:
          path: '"/v1/extauthz/check"'
          addRequestHeaders:
            x-idp-verified-subject: jwt.sub
            x-idp-verified-tenant: jwt.tenant_id
            x-idp-verified-env: jwt.env
            x-idp-route-id: '"mockcarrier-labels-create"'
            x-idp-provider-id: '"mockcarrier"'
            x-idp-operation-id: '"labels.create"'
            x-idp-environment: '"TEST"'
            x-idp-method: request.method
            x-idp-path: request.path
          includeResponseHeaders:
          - authorization
    urlRewrite:
      authority:
        full: 127.0.0.1:27612
      path:
        prefix: /v1/labels
    responseHeaderModifier:
      remove:
      - location
      - set-cookie
    # No retry policy on purpose: a non-idempotent write must reach the provider at most once.
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27612
    policies:
      authorization:
        rules:
        - allow: 'request.headers["authorization"].startsWith("Bearer ")'
      requestHeaderModifier:
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env

# ---------------------------------------------------------------------------------------
# Mode B (G04 §4): the credential comes from a broker running next to the gateway
# (mock_broker.py). The broker asks Gatekeeper for a decision only, over its own mTLS
# identity, and redeems the credential from a local store. Seen from the gateway this is
# the same ExtAuthZ exchange as Mode A, pointed at a loopback port.
# ---------------------------------------------------------------------------------------
- name: mockcarrier-manifests-get-broker
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/mockcarrier/v1/manifests
    method: GET
  policies:
    authorization:
      rules:
      - allow: 'request.path.matches("^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$")'
    extAuthz:
      host: 127.0.0.1:27618
      failureMode: deny
      includeRequestHeaders:
      - x-provider-account
      policies:
        # Stand-in for whatever confines a sidecar to its own gateway (a Unix socket, a pod
        # network namespace). On a shared host this key file is all that separates the
        # broker from any other local process.
        backendAuth:
          key:
            file: .run/broker-local.key
        http:
          requestTimeout: 1s
      protocol:
        http:
          path: '"/v1/extauthz/check"'
          addRequestHeaders:
            x-idp-verified-subject: jwt.sub
            x-idp-verified-tenant: jwt.tenant_id
            x-idp-verified-env: jwt.env
            x-idp-route-id: '"mockcarrier-manifests-get-broker"'
            x-idp-provider-id: '"mockcarrier"'
            x-idp-operation-id: '"manifests.get"'
            x-idp-environment: '"TEST"'
            x-idp-method: request.method
            x-idp-path: request.path
          includeResponseHeaders:
          - authorization
    urlRewrite:
      authority:
        full: 127.0.0.1:27612
      path:
        prefix: /v1/manifests
    responseHeaderModifier:
      remove:
      - location
      - set-cookie
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27612
    policies:
      authorization:
        rules:
        - allow: 'request.headers["authorization"].startsWith("Bearer ")'
      requestHeaderModifier:
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env

# ---------------------------------------------------------------------------------------
# Mode C (G04 §4): one fixed credential attached by the gateway. Included to show what it
# can and cannot do: every tenant leaves the gateway as the same provider account.
# ---------------------------------------------------------------------------------------
- name: mockcarrier-rates-get-static
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/mockcarrier/v1/rates
    method: GET
  policies:
    # No PDP on this route, so this rule is the only path check there is.
    authorization:
      rules:
      - allow: 'request.path.matches("^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$")'
    urlRewrite:
      authority:
        full: 127.0.0.1:27612
      path:
        prefix: /v1/rates
    responseHeaderModifier:
      remove:
      - location
      - set-cookie
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27612
    policies:
      backendAuth:
        key:
          file: .run/static-provider.key
      requestHeaderModifier:
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded

# ---------------------------------------------------------------------------------------
# Mode A again, with the credential placed by backendAuth.key.expression. Same PDP, same
# ExtAuthZ exchange and same answer as the two Mode A routes at the top. What differs is
# how the gateway takes the credential out of that answer:
#   those routes   includeResponseHeaders copies the PDP's `authorization` header.
#   this route     `metadata` reads it into extauthz.credential, and
#                  backendAuth.key.expression places that value on the upstream request.
# ADR-0008 proposes header copying for Mode A; this is the alternative it considered
# (cases P1-KX-01..03).
# ---------------------------------------------------------------------------------------
- name: mockcarrier-pickups-get-expression
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/mockcarrier/v1/pickups
    method: GET
  policies:
    authorization:
      rules:
      - allow: 'request.path.matches("^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$")'
    extAuthz:
      host: 127.0.0.1:27613
      failureMode: deny
      includeRequestHeaders:
      - x-provider-account
      policies:
        backendTLS:
          cert: .run/tls/gateway.crt
          key: .run/tls/gateway.key
          root: .run/tls/ca.crt
          hostname: gatekeeper.idp.test
        http:
          requestTimeout: 1s
      protocol:
        http:
          path: '"/v1/extauthz/check"'
          addRequestHeaders:
            x-idp-verified-subject: jwt.sub
            x-idp-verified-tenant: jwt.tenant_id
            x-idp-verified-env: jwt.env
            x-idp-route-id: '"mockcarrier-pickups-get-expression"'
            x-idp-provider-id: '"mockcarrier"'
            x-idp-operation-id: '"pickups.get"'
            x-idp-environment: '"TEST"'
            x-idp-method: request.method
            x-idp-path: request.path
          # Nothing from the PDP's answer is copied onto the upstream request. One value
          # is read out of it. If the header is absent the expression fails, the gateway
          # logs the failure and extauthz.credential stays unset.
          metadata:
            credential: 'response.headers["authorization"]'
    urlRewrite:
      authority:
        full: 127.0.0.1:27612
      path:
        prefix: /v1/pickups
    responseHeaderModifier:
      remove:
      - location
      - set-cookie
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27612
    policies:
      # Fail closed if the PDP allowed but released no credential. This rule runs BEFORE
      # backendAuth: at this point the request has no Authorization header yet, so the
      # header test used on the Mode A routes would deny every request here.
      authorization:
        rules:
        - allow: 'has(extauthz.credential) && extauthz.credential.startsWith("Bearer ")'
      backendAuth:
        key:
          expression: extauthz.credential
          location:
            header:
              name: authorization
      requestHeaderModifier:
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env

# ---------------------------------------------------------------------------------------
# Read-back: the only route on the read-back listener. Two exact paths, GET only, to the
# gateway's own admin address: what it is running (/config_dump) and whether its last load
# of the file succeeded (/api/runtime). Everything else the admin address offers (shutdown,
# log level, profiling, its UI and write API) has no route here (case P1-RB-03).
# ---------------------------------------------------------------------------------------
- name: read-back
  gateways: [read-back]
  matches:
  - path:
      exact: /config_dump
    method: GET
  - path:
      exact: /api/runtime
    method: GET
  policies:
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27614
