# P1 PoC — front proxy (nginx) between the callers and the gateway listener.
#
# Why it exists: agentgateway 1.6.0 and 1.7.0 accept a request that carries two Host
# headers (case P1-SS-04) and neither has a setting to refuse it. nginx answers such a
# request, and a request with no Host header, with 400 before anything is forwarded.
# Nothing below asks for that; it is nginx's own request parsing.
#
# Run by run.py in a container (image pinned by digest there), as an unprivileged
# user, on the host network, with this file mounted read-only. Loopback only.

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 127.0.0.1:27620;

        location / {
            # No URI part: the request target goes to the gateway as the caller sent it.
            # Path checks stay where they are, in the gateway route and the PDP.
            proxy_pass http://127.0.0.1:27611;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The gateway routes on the logical host name; nginx would otherwise send
            # the address in proxy_pass. $host is the one host nginx accepted.
            proxy_set_header Host $host;
            # A request is sent to the gateway once. A non-idempotent write must not be
            # replayed by this hop any more than by the gateway.
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            # Longer than the gateway's own 2s budget, so that the caller sees the
            # gateway's 504 and not one made up here.
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
