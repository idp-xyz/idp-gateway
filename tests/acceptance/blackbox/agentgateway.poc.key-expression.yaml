# P1 PoC — one more route for agentgateway.poc.yaml. NOT a configuration file on its own:
# run.py appends the items under `routes` below to the `routes` of agentgateway.poc.yaml,
# and only when the binary's validator accepts the result. 1.7.0 does; 1.6.0 rejects
# backendAuth.key.expression, and the cases for this route are then reported as SKIP.
# Keep `routes` the only key of this file.
#
# Same PDP, same ExtAuthZ exchange and same answer as the Mode A routes. What differs is
# how the gateway takes the credential out of that answer:
#   Mode A routes  includeResponseHeaders copies the PDP's `authorization` header.
#   this route     `metadata` reads it into extauthz.credential, and
#                  backendAuth.key.expression places that value on the upstream request.

routes:
- name: mockcarrier-pickups-get-expression
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/mockcarrier/v1/pickups
    method: GET
  policies:
    authorization:
      rules:
      - allow: 'request.path.matches("^(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$")'
    extAuthz:
      host: 127.0.0.1:27613
      failureMode: deny
      includeRequestHeaders:
      - x-provider-account
      policies:
        backendTLS:
          cert: .run/tls/gateway.crt
          key: .run/tls/gateway.key
          root: .run/tls/ca.crt
          hostname: gatekeeper.idp.test
        http:
          requestTimeout: 1s
      protocol:
        http:
          path: '"/v1/extauthz/check"'
          addRequestHeaders:
            x-idp-verified-subject: jwt.sub
            x-idp-verified-tenant: jwt.tenant_id
            x-idp-verified-env: jwt.env
            x-idp-route-id: '"mockcarrier-pickups-get-expression"'
            x-idp-provider-id: '"mockcarrier"'
            x-idp-operation-id: '"pickups.get"'
            x-idp-environment: '"TEST"'
            x-idp-method: request.method
            x-idp-path: request.path
          # Nothing from the PDP's answer is copied onto the upstream request. One value
          # is read out of it. If the header is absent the expression fails, the gateway
          # logs the failure and extauthz.credential stays unset.
          metadata:
            credential: 'response.headers["authorization"]'
    urlRewrite:
      authority:
        full: 127.0.0.1:27612
      path:
        prefix: /v1/pickups
    responseHeaderModifier:
      remove:
      - location
      - set-cookie
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:27612
    policies:
      # Fail closed if the PDP allowed but released no credential. This rule runs BEFORE
      # backendAuth: at this point the request has no Authorization header yet, so the
      # header test used on the Mode A routes would deny every request here.
      authorization:
        rules:
        - allow: 'has(extauthz.credential) && extauthz.credential.startsWith("Bearer ")'
      backendAuth:
        key:
          expression: extauthz.credential
          location:
            header:
              name: authorization
      requestHeaderModifier:
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env
