# 套在 deploy/compose/compose.yml 上用的，单独拿这个文件起不来。
#
# 这套用例跑的池就是部署文件描述的那一个，一处不改；这里只添两个容器，和三处设置。
# 部署文件自己不带后端，真的池里后端在别处。镜像和脚本的位置由 run.py 经环境变量给出。
#
# echo：路由的后端。
# resolver：替身解析器，跑的就是 tests/integration/egressnet/dns.py（从那个目录挂进来，不复制第二份），对每个名字答
# "不存在，否定缓存 600 秒"（run.py 在启动池之前把回答方式写在它挂着的目录里）。netns 的 dns 指向它：网关和 front 接在
# netns 的网络命名空间里，Docker 自己不认识的名字（后端 echo 不在时，就是 echo）由它回答。SH-15 看的是网关对"名字不存在"
# 的处理，这一条不该靠跑它的那台机器的解析器怎么答（真实的上游对不存在的名字答"可以缓存一小时"，有时又不答成那样）。
# 替身要一个固定的地址，所以默认网络的网段在这里定下来；与 tests/integration/egressnet 的 10.31.32.0/24 不重叠。
services:
  echo:
    image: ${TOOLS_IMAGE:?}
    command: ["python", "/scripts/probe.py", "echo"]
    environment:
      ECHO_PORT: "8000"
      PYTHONUNBUFFERED: "1"
    user: "65534:65534"
    volumes:
      - "${PROBE:?}:/scripts/probe.py:ro"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 2s

  resolver:
    image: ${TOOLS_IMAGE:?}
    command: ["python", "-u", "/opt/dns.py"]
    user: "65534:65534"
    volumes:
      - "${RESOLVER_SCRIPT:?}:/opt/dns.py:ro"
      - "${RESOLVER_ANSWERS:?}:/answers:ro"
    networks:
      default:
        ipv4_address: 10.31.33.53
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 1s

  netns:
    dns:
      - 10.31.33.53

networks:
  default:
    ipam:
      config:
        - subnet: 10.31.33.0/24
