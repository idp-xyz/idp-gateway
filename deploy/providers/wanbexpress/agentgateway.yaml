        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env

# Read-back: the only route on the read-back listener, as in the reviewed configuration.
- name: read-back
  gateways: [read-back]
  matches:
  - path:
      exact: /config_dump
    method: GET
  - path:
      exact: /api/runtime
    method: GET
  policies:
    timeout:
      requestTimeout: 2s
  backends:
  - host: 127.0.0.1:15000
