      - location
      - set-cookie
      - x-idp-decision-id
    # No retry policy on purpose. A DELETE that is sent again is harmless to the carrier but the gateway does not do it.
    timeout:
      requestTimeout: 9s
  backends:
  - host: api-sbx.wanbexpress.com:80
    policies:
      # Fail closed if the PDP allowed but released no credential. The caller's token was removed
