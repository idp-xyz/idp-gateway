          replace: 'request.headers.filterKeys(k, k in ["accept", "authorization", "content-type", "idempotency-key", "traceparent", "x-client-trace"])'
      requestHeaderModifier:
        # The carrier accepts only this Accept. Written here, after the allow list above has run,
        # so whatever the caller sent is replaced and a caller that sent none gets it too.
        set:
          accept: application/json
        remove:
        - x-provider-account
        - cookie
        - x-forwarded-host
        - x-forwarded-for
        - x-forwarded-proto
        - forwarded
        - x-idp-verified-subject
        - x-idp-verified-tenant
        - x-idp-verified-env

- name: wanbexpress-parcels-delete
  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/wanbexpress/v1/parcels
    method: DELETE
  policies:
    # Path shape (delete: DELETE on /parcels/{processCode}, one segment). The reviewed
    # configuration's canonical-path rule is a weaker form of this one: the characters allowed are the
    # same, and no segment starts with a dot, so "." and ".." cannot occur. The shape is also what keeps
    # a path that merely starts with the registered prefix (a list, a search, a deeper path) from reaching the
    # carrier; gateway-authz's register only compares a prefix, so this rule is the only place that says it.
    authorization:
      rules:
      - allow: 'request.path.matches("^/providers/wanbexpress/v1/parcels/[A-Za-z0-9][A-Za-z0-9._-]*$")'
    extAuthz:
      host: 127.0.0.1:27613
      failureMode:
        denyWithStatus: 503
      includeRequestHeaders:
      - x-provider-account
      policies:
