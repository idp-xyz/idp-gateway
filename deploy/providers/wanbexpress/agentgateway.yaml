  gateways: [egress-test]
  hostnames: ["egress-api.idp.test"]
  matches:
  - path:
      pathPrefix: /providers/wanbexpress/v1/parcels
    method: GET
  policies:
    # Path shape (get: GET on /parcels/{processCode}, one segment). The reviewed
