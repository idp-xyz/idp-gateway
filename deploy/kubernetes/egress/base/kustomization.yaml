apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: idp-egress
resources:
  - namespace.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-authz-deployment.yaml
  - gateway-authz-service.yaml
  - provider-signer-deployment.yaml
  - provider-signer-service.yaml
  - sf-token-coordinator.yaml
  - authz-state.yaml
  - networkpolicies.yaml
  - pvc.yaml
labels:
  - pairs:
      idp.xyz/pool: egress
    includeSelectors: false
