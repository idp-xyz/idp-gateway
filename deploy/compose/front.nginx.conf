# 网关前面的那层代理（docs/adr/ADR-0010.md 第 4 条）：业务请求先到它，再转给同一个网络命名空间里的网关。
#
# 为什么要有它：agentgateway 接受带两个 Host 头的请求（黑盒用例 P1-SS-04），也没有哪项设置能让它拒绝。
# nginx 遇到这种请求，或者没有 Host 头的请求，直接答 400，什么都不往后转。下面没有哪一行是为此写的，
# 这是 nginx 自己解析请求时的行为。
#
# 各条指令与黑盒套件跑过的那一份（tests/acceptance/blackbox/front.nginx.conf）相同，只有两处不同：
# 监听的端口，和转给谁。tests/contracts 里有一条测试核对这一点；要改这里，先改那一份并重跑黑盒套件。

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        # compose.yml 把本机上收业务请求的那个地址映射到这个端口。
        listen 8080;

        location / {
            # 不带 URI 部分：请求的路径按调用方发来的样子交给网关。路径的检查在网关的路由和 PDP 那里。
            # 8081 是网关收业务请求的监听，只绑回环；快照里的监听要用这个端口。
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # 网关按逻辑主机名选路由；不写这一行，nginx 送过去的是 proxy_pass 里的地址。
            # $host 是 nginx 接受下来的那一个主机名。
            proxy_set_header Host $host;
            # 一个请求只往网关送一次：非幂等的写操作，这一层和网关一样不能重放。
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            # 这里等网关最多 10 秒。路由的超时要定得比它短，调用方看到的才是网关答的 504，
            # 不是这里造出来的。
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
